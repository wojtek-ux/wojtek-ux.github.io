<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body { background:black; color:lime; text-align:center; font-family:monospace; }
input { padding:10px; background:black; color:lime; border:1px solid lime; }
</style>
</head>

<body>
<h1>Proszę wprowadź nazwę użytkownika</h1>

<input id="name" placeholder="Twój nick">
<br><br>
<button onclick="go()">ENTER</button>

<script>
function go() {
    let name = document.getElementById("name").value;
    localStorage.setItem("user", name);
    window.location.href = "index2.html";
}
</script>

</body>
</html>
