<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>VKN Downloads</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

header { padding:40px; }

.container {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

.card {
    background:#1e293b;
    width:300px;
    margin:15px;
    padding:20px;
    border-radius:15px;
}

/* 🔥 */
.badge {
    background:red;
    padding:5px 10px;
    border-radius:10px;
}

/* 🔘 */
.downloadBtn {
    background:cyan;
    padding:10px;
    display:inline-block;
    margin-top:10px;
    border-radius:10px;
    cursor:pointer;
    color:black;
}

/* ⭐ */
.stars span {
    font-size:25px;
    cursor:pointer;
}

/* 💬 */
.reviewBox input,
.reviewBox textarea {
    width:90%;
    margin:5px;
    padding:5px;
}

/* 📞 */
footer {
    position:fixed;
    bottom:0;
    width:100%;
    background:#020617;
    padding:10px;
}
</style>
</head>

<body>

<header>
<h1>VKN Downloads</h1>
</header>

<div class="container">

<div class="card">

<div class="badge">🔥 NOWOŚĆ</div>

<h3>AI_BOT - 0.1.1</h3>

<!-- 📥 -->
<div id="dl">📥 Pobrania: 0</div>

<div class="downloadBtn" onclick="download()">Pobierz</div>

<!-- ⭐ WYBÓR -->
<div class="stars" id="stars">
    <span onclick="setStars(1)">⭐</span>
    <span onclick="setStars(2)">⭐</span>
    <span onclick="setStars(3)">⭐</span>
    <span onclick="setStars(4)">⭐</span>
    <span onclick="setStars(5)">⭐</span>
</div>

<!-- ✍️ OPINIA -->
<div class="reviewBox">
    <input id="nick" placeholder="Twój nick">
    <textarea id="text" placeholder="Twoja opinia"></textarea>
    <button onclick="addReview()">Dodaj opinię</button>
</div>

<!-- 💬 LISTA -->
<div id="reviews"></div>

</div>

</div>

<footer>
🔒 Bezpieczne pliki ✔️<br>© VKN 2026
</footer>

<script>

/* 📥 LICZNIK */
let downloads = localStorage.getItem("downloads") || 0;
document.getElementById("dl").innerText = "📥 Pobrania: " + downloads;

function download(){
    downloads++;
    localStorage.setItem("downloads", downloads);
    document.getElementById("dl").innerText = "📥 Pobrania: " + downloads;

    window.location.href = "AI_BOT-0.1.1.zip";
}

/* ⭐ OCENA */
let selectedStars = 0;

function setStars(n){
    selectedStars = n;
    let stars = document.getElementById("stars").children;

    for(let i=0;i<5;i++){
        stars[i].style.opacity = i < n ? "1" : "0.3";
    }
}

/* 💬 OPINIE */
function addReview(){

    let nick = document.getElementById("nick").value;
    let text = document.getElementById("text").value;

    if(!nick || !text || selectedStars == 0){
        alert("Uzupełnij wszystko!");
        return;
    }

    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

    reviews.push({
        nick,
        text,
        stars: selectedStars
    });

    localStorage.setItem("reviews", JSON.stringify(reviews));

    loadReviews();
}

/* 📥 WCZYTANIE */
function loadReviews(){

    let box = document.getElementById("reviews");
    box.innerHTML = "";

    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

    reviews.forEach(r=>{
        box.innerHTML += `
            <p><b>${r.nick}</b> ⭐${r.stars}<br>${r.text}</p>
        `;
    });
}

loadReviews();

</script>

</body>
</html>
