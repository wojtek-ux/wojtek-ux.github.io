<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>VKN Downloads</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

header {
    padding:40px;
}

h1 {
    font-size:40px;
}

/* 📦 */
.container {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

/* 🧾 */
.card {
    background:#1e293b;
    width:260px;
    margin:15px;
    padding:20px;
    border-radius:15px;
    position:relative;
    transition:0.3s;
}

.card:hover {
    transform:translateY(-10px);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* 🔥 NOWOŚĆ */
.badge {
    position:absolute;
    top:10px;
    left:10px;
    background:red;
    padding:5px 10px;
    border-radius:10px;
    font-size:12px;
}

/* 🖼️ */
.card img {
    width:100%;
    border-radius:10px;
}

/* 🔘 */
.downloadBtn {
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    background:cyan;
    color:black;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

.downloadBtn:active {
    transform:scale(0.95);
}

/* ❌ */
.disabled {
    background:gray;
    pointer-events:none;
    opacity:0.6;
}

/* ⭐ */
.stars {
    margin-top:10px;
    font-size:20px;
    cursor:pointer;
}

/* 📥 licznik */
.downloads {
    margin-top:5px;
    font-size:14px;
    opacity:0.7;
}

/* 📞 */
footer {
    position:fixed;
    bottom:0;
    width:100%;
    background:#020617;
    color:#aaa;
    padding:10px;
}
</style>
</head>

<body>

<header>
    <h1>VKN Downloads</h1>
    <p>Pobierz nasze projekty python !🔥</p>
</header>

<div class="container">

    <!-- ✅ MOD -->
    <div class="card">

        <div class="badge">🔥 NOWOŚĆ</div>

        <img src="AIBOT.png">

        <h3>AI_BOT - 0.1.1</h3>
        <p>Pisz do chata i ucz go !</p>

        <div class="stars" onclick="rate(this)">
            ⭐⭐⭐⭐⭐
        </div>

        <div class="downloads" id="dl1">
            📥 Pobrania: 0
        </div>

        <a href="AI_BOT - 0.1.1.zip" class="downloadBtn" onclick="addDownload()">Pobierz</a>

    </div>

    <!-- ❌ PUSTE -->
    <div class="card">
        <img src="brak.png">
        <h3>Brak dodatku</h3>
        <p>Opis pojawi się wkrótce...</p>
        <a class="downloadBtn disabled">Brak</a>
    </div>

</div>

<footer>
🔒 Wszystkie pliki są w 100% bezpieczne ✔️  
<br>
© VKN 2026
</footer>

<script>

/* 📥 licznik */
let downloads = 0;

function addDownload(){
    downloads++;
    document.getElementById("dl1").innerText =
        "📥 Pobrania: " + downloads;
}

/* ⭐ oceny */
function rate(el){

    let x = event.offsetX;
    let width = el.offsetWidth;

    let stars = Math.ceil((x / width) * 5);

    el.innerText = "⭐".repeat(stars);
}

</script>

</body>
</html>
