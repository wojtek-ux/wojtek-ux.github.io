<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>VKN Downloads</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

header { padding:40px; }

.container {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

.card {
    background:#1e293b;
    width:320px;
    margin:15px;
    padding:20px;
    border-radius:15px;
}

.badge {
    background:red;
    padding:5px 10px;
    border-radius:10px;
}

.downloadBtn {
    background:cyan;
    padding:10px;
    display:inline-block;
    margin-top:10px;
    border-radius:10px;
    cursor:pointer;
    color:black;
    text-decoration:none;
}

.stars span {
    font-size:25px;
    cursor:pointer;
}

.reviewBox input,
.reviewBox textarea {
    width:90%;
    margin:5px;
    padding:5px;
}

.moreBtn {
    margin-top:10px;
    padding:8px 15px;
    border-radius:10px;
    cursor:pointer;
}

footer {
    position:fixed;
    bottom:0;
    width:100%;
    background:#020617;
    padding:10px;
}
</style>
</head>

<body>

<header>
<h1>VKN Downloads</h1>
</header>

<div class="container">

<div class="card">

<div class="badge">🔥 NOWOŚĆ</div>

<h3>AI_BOT - 0.1.1</h3>

<!-- 📥 -->
<div id="dl">📥 Pobrania: 0</div>

<!-- 🔥 POBIERANIE -->
<a href="AI_BOT-0.1.1.zip" class="downloadBtn" onclick="download()">Pobierz</a>

<!-- ⭐ -->
<div class="stars" id="stars">
    <span onclick="setStars(1)">⭐</span>
    <span onclick="setStars(2)">⭐</span>
    <span onclick="setStars(3)">⭐</span>
    <span onclick="setStars(4)">⭐</span>
    <span onclick="setStars(5)">⭐</span>
</div>

<!-- ✍️ -->
<div class="reviewBox">
    <input id="nick" placeholder="Twój nick">
    <textarea id="text" placeholder="Twoja opinia"></textarea>
    <button onclick="addReview()">Dodaj opinię</button>
</div>

<!-- 💬 -->
<div id="reviews"></div>

</div>

</div>

<footer>
🔒 Bezpieczne pliki ✔️<br>© VKN 2026
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyAR68Bk1HhJshjCAKJFdF6QWB2e00rNB2k",
  authDomain: "vkn-opinie.firebaseapp.com",
  projectId: "vkn-opinie",
  storageBucket: "vkn-opinie.appspot.com",
  messagingSenderId: "762125137327",
  appId: "1:762125137327:web:3fa370c8b8bcd90965ab5a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 📥 GLOBALNE POBRANIA */
async function loadDownloads(){
    const ref = doc(db, "downloads", "main");
    const snap = await getDoc(ref);

    if(snap.exists()){
        document.getElementById("dl").innerText = "📥 Pobrania: " + snap.data().count;
    } else {
        await setDoc(ref, { count: 0 });
        document.getElementById("dl").innerText = "📥 Pobrania: 0";
    }
}

window.download = async function(){

    const ref = doc(db, "downloads", "main");
    const snap = await getDoc(ref);

    let count = 0;

    if(snap.exists()){
        count = snap.data().count;
    }

    count++;

    await setDoc(ref, { count: count });

    document.getElementById("dl").innerText = "📥 Pobrania: " + count;
}

/* ⭐ */
let selectedStars = 0;

window.setStars = function(n){
    selectedStars = n;
    let stars = document.getElementById("stars").children;
    for(let i=0;i<5;i++){
        stars[i].style.opacity = i < n ? "1" : "0.3";
    }
}

/* 💬 OPINIE */
window.addReview = async function(){

    let nick = document.getElementById("nick").value;
    let text = document.getElementById("text").value;

    if(!nick || !text || selectedStars == 0){
        alert("Uzupełnij wszystko!");
        return;
    }

    await addDoc(collection(db, "reviews"), {
        nick,
        text,
        stars: selectedStars
    });

    document.getElementById("nick").value = "";
    document.getElementById("text").value = "";

    loadReviews();
}

async function loadReviews(){

    let box = document.getElementById("reviews");
    box.innerHTML = "";

    let querySnapshot = await getDocs(collection(db, "reviews"));

    let reviews = [];

    querySnapshot.forEach(doc=>{
        reviews.push(doc.data());
    });

    reviews.slice(0,3).forEach(r=>{
        box.innerHTML += `
            <p><b>${r.nick}</b> ⭐${r.stars}<br>${r.text}</p>
        `;
    });

    if(reviews.length > 3){
        box.innerHTML += `
            <button class="moreBtn" onclick="moreReviews()">Zobacz więcej...</button>
        `;
    }
}

window.moreReviews = function(){
    window.location.href = "opinie.html";
}

/* START */
loadDownloads();
loadReviews();

</script>

</body>
</html>
