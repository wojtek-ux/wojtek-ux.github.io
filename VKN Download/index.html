<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>VKN Downloads</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}
.card{
    background:#1e293b;
    width:350px;
    margin:50px auto;
    padding:20px;
    border-radius:15px;
}
.btn{
    background:cyan;
    padding:10px;
    display:inline-block;
    margin-top:10px;
    border-radius:10px;
    cursor:pointer;
    color:black;
    text-decoration:none;
}
input,textarea{
    width:90%;
    margin:5px;
    padding:5px;
}
.reply{
    font-size:13px;
    color:#cbd5f5;
}
.panel{
    position:fixed;
    bottom:60px;
    right:10px;
    background:red;
    padding:8px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>AI_BOT</h2>

<div id="dl">📥 Pobrania: 0</div>

<a href="AI_BOT-0.1.1" class="btn" onclick="download(event)">Pobierz</a>

<br><br>

<div id="stars">
<span onclick="setStars(1)">⭐</span>
<span onclick="setStars(2)">⭐</span>
<span onclick="setStars(3)">⭐</span>
<span onclick="setStars(4)">⭐</span>
<span onclick="setStars(5)">⭐</span>
</div>

<input id="nick" placeholder="Nick">
<textarea id="text" placeholder="Opinia"></textarea>
<button onclick="addReview()">Dodaj</button>

<div id="reviews"></div>

</div>

<div class="panel" onclick="goPanel()">Panel</div>

<script>
function goPanel(){
    location.href="login.html";
}
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, updateDoc, increment } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyAR68Bk1HhJshjCAKJFdF6QWB2e00rNB2k",
  projectId:"vkn-opinie"
});

const db = getFirestore(app);

/* 📥 LOAD DOWNLOADS */
async function loadDL(){
    const r=doc(db,"downloads","main");
    const s=await getDoc(r);

    if(s.exists()){
        dl.innerText="📥 Pobrania: "+s.data().count;
    }else{
        await setDoc(r,{count:0});
    }
}

/* 🔥 DOWNLOAD FIX */
window.download=async(e)=>{
    e.preventDefault();

    const r=doc(db,"downloads","main");

    try{
        await updateDoc(r,{count:increment(1)});
    }catch{
        await setDoc(r,{count:1});
    }

    await loadDL();

    setTimeout(()=>{
        location.href="AI_BOT-0.1.1.zip";
    },300);
}

/* ⭐ */
let stars=0;
window.setStars=n=>stars=n;

/* 💬 ADD */
window.addReview=async()=>{
    let n=nick.value;
    let t=text.value;

    if(!n||!t||!stars)return alert("Uzupełnij!");

    await addDoc(collection(db,"reviews"),{
        nick:n,text:t,stars
    });

    nick.value="";
    text.value="";
    loadReviews();
}

/* 💬 REPLY */
window.addReply=async(id)=>{
    let v=document.getElementById("r"+id).value;
    if(!v)return;

    await addDoc(collection(db,"reviews",id,"replies"),{text:v});
    loadReviews();
}

/* 📥 LOAD REVIEWS */
async function loadReviews(){
    reviews.innerHTML="";
    let q=await getDocs(collection(db,"reviews"));

    q.forEach(d=>{
        let r=d.data();

        reviews.innerHTML+=`
        <div>
        <b>${r.nick}</b> ⭐${r.stars}<br>${r.text}
        <br>
        <input id="r${d.id}">
        <button onclick="addReply('${d.id}')">↩️</button>
        <div id="rep${d.id}"></div>
        </div>
        `;

        loadReplies(d.id);
    });
}

/* 📥 LOAD REPLIES */
async function loadReplies(id){
    let box=document.getElementById("rep"+id);
    let q=await getDocs(collection(db,"reviews",id,"replies"));

    q.forEach(d=>{
        box.innerHTML+=`<div class="reply">↳ ${d.data().text}</div>`;
    });
}

loadDL();
loadReviews();

</script>

</body>
</html>
