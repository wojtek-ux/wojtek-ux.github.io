<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wszystkie opinie</title>

<style>
body {
    background:#0f172a;
    color:white;
    text-align:center;
    font-family:Arial;
}

.review {
    background:#1e293b;
    margin:15px;
    padding:15px;
    border-radius:10px;
}

.reply {
    font-size:14px;
    color:#cbd5f5;
}
</style>
</head>

<body>

<h1>💬 Wszystkie opinie</h1>

<button onclick="back()">⬅ Powrót</button>

<div id="allReviews"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAR68Bk1HhJshjCAKJFdF6QWB2e00rNB2k",
  authDomain: "vkn-opinie.firebaseapp.com",
  projectId: "vkn-opinie"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.back = function(){
    window.location.href = "index.html";
}

async function loadReviews(){

    let box = document.getElementById("allReviews");
    box.innerHTML = "";

    let querySnapshot = await getDocs(collection(db, "reviews"));

    for (let docSnap of querySnapshot.docs){

        let r = docSnap.data();

        box.innerHTML += `
        <div class="review">
            <b>${r.nick}</b> ⭐${r.stars}<br>${r.text}
            <div id="replies-${docSnap.id}"></div>
        </div>
        `;

        loadReplies(docSnap.id);
    }
}

async function loadReplies(id){

    let box = document.getElementById("replies-"+id);

    let querySnapshot = await getDocs(collection(db, "reviews", id, "replies"));

    querySnapshot.forEach(doc=>{
        box.innerHTML += `<div class="reply">↳ ${doc.data().text}</div>`;
    });
}

loadReviews();

</script>

</body>
</html>
