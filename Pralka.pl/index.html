<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Pralka Simulator</title>

<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    overflow:hidden;
}

#washer {
    width:200px;
    margin-top:40px;
}

/* 🔄 spin */
.spin {
    animation: spin 1s linear infinite;
}
@keyframes spin {
    from {transform:rotate(0deg);}
    to {transform:rotate(360deg);}
}

.cloth {
    width:80px;
    position:absolute;
    cursor:grab;
}

#points {
    font-size:20px;
}

/* 💎 sklep */
.shopBtn {
    display:inline-block;
    margin-top:20px;
    padding:10px;
    background:cyan;
    color:black;
    border-radius:10px;
    text-decoration:none;
}
</style>
</head>

<body>

<h1>🧺 PRALKA 🧺</h1>

<div id="points">💰 0</div>

<img src="pralka.jpg" id="washer">

<br>
<a href="shop.html" class="shopBtn">💎 SKLEP</a>

<img src="ubranie1.jpg" class="cloth" id="c1">
<img src="ubranie2.jpg" class="cloth" id="c2">
<img src="ubranie3.jpg" class="cloth" id="c3">

<script>

let points = Number(localStorage.getItem("points")) || 0;
let multiplier = Number(localStorage.getItem("multi")) || 1;

let clothesIn = 0;

let startPos = {
    c1:{x:50,y:200},
    c2:{x:150,y:300},
    c3:{x:250,y:250}
};

function update(){
    document.getElementById("points").innerText =
        "💰 " + points + " | x" + multiplier;
}

function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("multi", multiplier);
}

function resetClothes(){
    clothesIn=0;
    for(let id in startPos){
        let c=document.getElementById(id);
        c.style.display="block";
        c.style.left=startPos[id].x+"px";
        c.style.top=startPos[id].y+"px";
    }
}

document.querySelectorAll(".cloth").forEach(cloth=>{
    cloth.onmousedown=function(){
        document.onmousemove=e=>{
            cloth.style.left=e.pageX-40+"px";
            cloth.style.top=e.pageY-40+"px";
        }
        document.onmouseup=()=>{
            document.onmousemove=null;

            let w=document.getElementById("washer").getBoundingClientRect();
            let c=cloth.getBoundingClientRect();

            if(c.left>w.left && c.right<w.right && c.top>w.top && c.bottom<w.bottom){
                cloth.style.display="none";
                clothesIn++;
            }
        }
    }
});

document.getElementById("washer").onclick=function(){
    if(clothesIn>0){
        this.classList.add("spin");

        setTimeout(()=>{
            this.classList.remove("spin");

            let reward = clothesIn * 10 * multiplier;
            points += reward;

            alert("+"+reward+" 💰");

            resetClothes();
            save();
            update();

        },5000);
    } else alert("Wrzuć ubrania!");
}

resetClothes();
update();

</script>

</body>
</html>
