<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Pralka Simulator</title>

<style>
body {
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    overflow:hidden;
}

h1 {
    margin-top:10px;
}

/* 🧺 PRALKA */
#washer {
    width:200px;
    margin-top:40px;
    transition:0.3s;
}

/* 🔄 obrót */
.spin {
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 👕 UBRANIA */
.cloth {
    width:80px;
    position:absolute;
    cursor:grab;
}

/* 💰 punkty */
#points {
    font-size:20px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>🧺 PRALKA SIMULATOR 🧺</h1>

<div id="points">💰 0</div>

<!-- 🧺 TWOJA PRALKA -->
<img src="pralka.jpg" id="washer">

<!-- 👕 TWOJE UBRANIA -->
<img src="ubranie1.jpg" class="cloth" id="c1">
<img src="ubranie2.jpg" class="cloth" id="c2">
<img src="ubranie3.jpg" class="cloth" id="c3">

<script>

let points = 0;
let clothesIn = 0;

/* 📌 STARTOWE POZYCJE */
let startPos = {
    c1: {x:50, y:200},
    c2: {x:150, y:300},
    c3: {x:250, y:250}
};

/* 🔄 ustaw start */
function resetClothes(){
    clothesIn = 0;

    for(let id in startPos){
        let c = document.getElementById(id);
        c.style.display = "block";
        c.style.left = startPos[id].x + "px";
        c.style.top = startPos[id].y + "px";
    }
}

/* 🖱️ DRAG */
document.querySelectorAll(".cloth").forEach(cloth => {

    cloth.onmousedown = function(){

        document.onmousemove = function(e){
            cloth.style.left = e.pageX - 40 + "px";
            cloth.style.top = e.pageY - 40 + "px";
        }

        document.onmouseup = function(){
            document.onmousemove = null;

            let washer = document.getElementById("washer").getBoundingClientRect();
            let c = cloth.getBoundingClientRect();

            if(
                c.left > washer.left &&
                c.right < washer.right &&
                c.top > washer.top &&
                c.bottom < washer.bottom
            ){
                cloth.style.display = "none";
                clothesIn++;
            }
        }
    }

});

/* 🧺 KLIK PRALKI */
document.getElementById("washer").onclick = function(){

    if(clothesIn > 0){

        let w = this;
        w.classList.add("spin");

        setTimeout(()=>{
            w.classList.remove("spin");

            let reward = clothesIn * 10;
            points += reward;

            document.getElementById("points").innerText = "💰 " + points;

            alert("Wyprane! +" + reward + " 💰");

            /* 🔥 PRZYWRÓĆ UBRANIA */
            resetClothes();

        },5000);

    } else {
        alert("Wrzuć ubrania!");
    }
}

/* start */
resetClothes();

</script>

</body>
</html>
