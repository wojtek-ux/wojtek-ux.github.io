<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sklep</title>

<style>
body {
    margin:0;
    background:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(white 1px, transparent 1px),
    black;

    background-size:40px 40px, 60px 60px;
    background-position:0 0, 20px 20px;

    animation: moveStars 20s linear infinite;

    color:cyan;
    font-family:Arial;
    text-align:center;
}

@keyframes moveStars {
    from {background-position:0 0, 20px 20px;}
    to {background-position:0 1000px, 20px 1020px;}
}

.box {
    background:#0f172a;
    margin:20px auto;
    padding:20px;
    width:300px;
    border-radius:20px;
    box-shadow:0 0 20px cyan;
}

button {
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:cyan;
    font-weight:bold;
    cursor:pointer;
}

button:active {
    transform:scale(0.95);
}

.back {
    margin-top:20px;
    display:inline-block;
    padding:10px 20px;
    background:cyan;
    border-radius:10px;
    text-decoration:none;
    color:black;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>💎 SKLEP 💎</h1>

<h2 id="stats">Ładowanie...</h2>

<!-- ⚡ klik -->
<div class="box">
    <h3>⚡ +1 Klik</h3>
    <p id="clickCost"></p>
    <button onclick="buyClick()">Kup</button>
</div>

<!-- 🤖 auto -->
<div class="box">
    <h3>🤖 Auto Klik</h3>
    <p id="autoCost"></p>
    <button onclick="buyAuto()">Kup</button>
</div>

<!-- 💀 RESET -->
<div class="box">
    <h3>💀 RESET (REBIRTH)</h3>
    <p>Wymagane: 1 000 000 punktów</p>
    <button onclick="rebirth()">RESET</button>
</div>

<br>

<a href="index.html" class="back">⬅ Powrót</a>

<script>

let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;
let rebirths = Number(localStorage.getItem("rebirths")) || 0;

/* ceny */
let clickCost = Math.floor(10 * Math.pow(1.5, clickPower-1));
let autoCost = Math.floor(50 * Math.pow(1.7, auto));

function update(){
    document.getElementById("stats").innerText =
        "⚡ " + points + " | Klik: " + clickPower +
        " | Auto: " + auto + " | 💀 Rebirthy: " + rebirths;

    document.getElementById("clickCost").innerText =
        "Koszt: " + clickCost;

    document.getElementById("autoCost").innerText =
        "Koszt: " + autoCost;
}

function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    localStorage.setItem("rebirths", rebirths);
}

/* kup klik */
function buyClick(){
    if(points >= clickCost){
        points -= clickCost;
        clickPower++;
        clickCost = Math.floor(10 * Math.pow(1.5, clickPower-1));
        save();
        update();
    } else alert("Za mało punktów!");
}

/* kup auto */
function buyAuto(){
    if(points >= autoCost){
        points -= autoCost;
        auto++;
        autoCost = Math.floor(50 * Math.pow(1.7, auto));
        save();
        update();
    } else alert("Za mało punktów!");
}

/* 💀 RESET */
function rebirth(){
    if(points >= 1000000){
        rebirths++;

        alert("💀 REBIRTH x" + rebirths);

        points = 0;
        clickPower = 1 + rebirths; /* 🔥 boost */
        auto = 0;

        save();
        update();
    } else {
        alert("Potrzebujesz 1,000,000!");
    }
}

update();

</script>

</body>
</html>
