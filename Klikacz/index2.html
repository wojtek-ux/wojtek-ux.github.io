<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sklep</title>

<style>
body {
    background:#020617;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:50px;
}

button {
    padding:12px;
    margin:10px;
    background:cyan;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover {
    background:white;
}
</style>
</head>

<body>

<h1>💎 Sklep 💎</h1>

<h2 id="points">Ładowanie...</h2>

<button onclick="buyClick()">+1 klik (10)</button>
<button onclick="buyAuto()">Auto klik (50)</button>
<button onclick="rebirth()">💀 REBIRTH (1M)</button>

<br><br>
<button onclick="back()">⬅ Powrót</button>

<script>

// 🔢 dane
let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;
let rebirths = Number(localStorage.getItem("rebirths")) || 0;

// 🔄 update
function update(){
    document.getElementById("points").innerText =
        "Punkty: " + points + " | 💀 Rebirthy: " + rebirths;
}

// 💾 zapis
function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    localStorage.setItem("rebirths", rebirths);
    update();
}

// 🔼 upgrade klik
function buyClick(){
    if(points >= 10){
        points -= 10;
        clickPower++;
        save();
    } else {
        alert("❌ Za mało punktów!");
    }
}

// ⚡ auto klik
function buyAuto(){
    if(points >= 50){
        points -= 50;
        auto++;
        save();
    } else {
        alert("❌ Za mało punktów!");
    }
}

// 💀 rebirth
function rebirth(){
    if(points >= 1000000){
        rebirths++;

        alert("💀 REBIRTH x" + rebirths);

        points = 0;
        clickPower = 1;
        auto = 0;

        save();
    } else {
        alert("❌ Potrzebujesz 1,000,000 punktów!");
    }
}

// 🔙 powrót
function back(){
    window.location.href = "index.html";
}

// start
update();

</script>

</body>
</html>
