<script>

let points = parseInt(localStorage.getItem("points") || 0);
let clickPower = parseInt(localStorage.getItem("clickPower") || 1);
let auto = parseInt(localStorage.getItem("auto") || 0);
let rebirths = parseInt(localStorage.getItem("rebirths") || 0);

// 🔥 aktualizacja UI
function update(){
    document.getElementById("points").innerText =
        "Punkty: " + points + " | 💀 Rebirthy: " + rebirths;
}

// 💎 upgrade klik
function buyClick(){
    if(points >= 10){
        points -= 10;
        clickPower++;
        save();
    }
}

// ⚡ auto klik
function buyAuto(){
    if(points >= 50){
        points -= 50;
        auto++;
        save();
    }
}

// 💀 REBIRTH PRO
function rebirth(){
    if(points >= 1000000){

        rebirths++;

        alert("💀 REBIRTH! +" + rebirths + " BOOST!");

        // reset gry
        points = 0;
        clickPower = 1 + rebirths; // 🔥 boost po rebirth
        auto = 0;

        save();
        localStorage.setItem("rebirths", rebirths);

        update();

    } else {
        alert("❌ Potrzebujesz 1,000,000 punktów!");
    }
}

// 💾 zapis
function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
}

// 🔙 powrót
function goBack(){
    window.location.href = "index.html";
}

update();

</script>
