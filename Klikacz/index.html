<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Galactic Clicker</title>

<style>
body {
    margin:0;
    background:black;
    color:cyan;
    font-family:Arial;
    text-align:center;
    user-select:none;
    overflow:hidden;
}

/* 🔥 KROPKI (GWIAZDY) */
.stars {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none; /* 💀 NIE BLOKUJE */
    z-index:0;
}

.star {
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    opacity:0.8;
    animation: move linear infinite;
}

@keyframes move {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(100vh);
    }
}

/* 🌯 obrazek */
#clickBtn {
    width:220px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 0 40px cyan;
    position:relative;
    z-index:1;
}

/* 🔘 sklep */
.shopBtn {
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:cyan;
    border-radius:10px;
    text-decoration:none;
    color:black;
    font-weight:bold;
    position:relative;
    z-index:1;
}

h1, h2 {
    position:relative;
    z-index:1;
}
</style>
</head>

<body>

<!-- 🔥 GWIAZDY -->
<div class="stars" id="stars"></div>

<h1>🚀 CLICKER 🚀</h1>

<h2 id="points">0</h2>

<img src="Klik1.jpg" id="clickBtn">

<br><br>

<a href="index2.html" class="shopBtn">💎 SKLEP</a>

<script>

/* ⭐ generowanie gwiazd */
for(let i=0;i<120;i++){
    let star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random()*100 + "%";
    star.style.top = Math.random()*100 + "%";
    star.style.animationDuration = (Math.random()*5+5)+"s";

    document.getElementById("stars").appendChild(star);
}

/* dane */
let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;

function update(){
    document.getElementById("points").innerText =
        "⚡ " + points + " | Klik: " + clickPower + " | Auto: " + auto;
}

function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    update();
}

function click(){
    points += clickPower;
    save();
}

document.getElementById("clickBtn").onclick = click;

document.addEventListener("keydown", (e)=>{
    if(e.code === "Space"){
        e.preventDefault();
        click();
    }
});

setInterval(()=>{
    if(auto > 0){
        points += auto;
        save();
    }
},1000);

update();

</script>

</body>
</html>
