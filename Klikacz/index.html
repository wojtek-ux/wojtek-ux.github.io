<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Klikacz Kosmiczny</title>

<style>
body {
    margin:0;
    font-family:Orbitron, monospace;
    background: radial-gradient(circle at center, #020617, #000);
    color:#00ffff;
    text-align:center;
    overflow:hidden;
}

/* ✨ TŁO GWIAZD */
body::before {
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background: repeating-radial-gradient(circle, white 0px, transparent 2px);
    animation: stars 60s linear infinite;
    opacity:0.2;
}

@keyframes stars {
    from {transform: translate(0,0);}
    to {transform: translate(-500px,-500px);}
}

/* 🔥 GLOW */
h1 {
    font-size:40px;
    text-shadow:0 0 20px cyan, 0 0 40px blue;
}

#points {
    font-size:25px;
    margin:20px;
}

/* 💎 PRZYCISK */
#clickBtn {
    width:200px;
    height:200px;
    border-radius:50%;
    background:linear-gradient(45deg, cyan, blue);
    border:none;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 0 30px cyan;
    transition:0.2s;
}

#clickBtn:hover {
    transform:scale(1.1);
    box-shadow:0 0 60px cyan;
}

/* 🚀 MENU */
button {
    margin:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:cyan;
    font-weight:bold;
    cursor:pointer;
}

button:hover {
    background:white;
}
</style>
</head>

<body>

<h1>🚀 GALACTIC CLICKER 🚀</h1>

<h2 id="points">0</h2>

<button id="clickBtn">CLICK</button>

<br><br>

<button onclick="goShop()">💎 Sklep</button>
<button onclick="reset()">💀 Reset</button>

<script>

let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;

function update(){
    document.getElementById("points").innerText = "Punkty: " + points;
}

function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    update();
}

/* 🖱️ klik */
document.getElementById("clickBtn").onclick = () => {
    points += clickPower;
    save();
};

/* ⌨️ SPACJA = klik */
document.addEventListener("keydown", (e) => {
    if(e.code === "Space"){
        e.preventDefault();
        points += clickPower;
        save();
    }
});

/* ⚡ auto klik */
setInterval(() => {
    if(auto > 0){
        points += auto;
        save();
    }
}, 1000);

/* 🔙 sklep */
function goShop(){
    window.location.href = "index2.html";
}

/* 💀 reset */
function reset(){
    if(confirm("Na pewno?")){
        localStorage.clear();
        location.reload();
    }
}

update();

</script>

</body>
</html>
