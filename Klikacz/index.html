<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Galactic Clicker</title>

<style>
body {
    margin:0;
    color:cyan;
    font-family:Arial;
    text-align:center;
    user-select:none;
    overflow:hidden;

    background:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(white 1px, transparent 1px),
    black;

    background-size:40px 40px, 60px 60px;
    background-position:0 0, 20px 20px;

    animation: moveStars 20s linear infinite;
}

@keyframes moveStars {
    from {background-position:0 0, 20px 20px;}
    to {background-position:0 1000px, 20px 1020px;}
}

#clickBtn {
    width:220px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 0 40px cyan;
}

.spin {
    animation: spin 0.5s linear;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.shopBtn {
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:cyan;
    border-radius:10px;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

/* 🔴 PANEL */
.panelBtn {
    position:fixed;
    bottom:50px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 20px;
    background:red;
    color:white;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

/* 💙 STOPKA */
.julka {
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
    color:#00ffff;
    opacity:0.8;
}
</style>
</head>

<body>

<h1>🚀 CLICKER 🚀</h1>

<h2 id="points">0</h2>

<img src="Klik1.jpg" id="clickBtn">

<br><br>

<a href="index2.html" class="shopBtn">💎 SKLEP</a>

<a href="panel.html" class="panelBtn">🔴 PANEL</a>

<div class="julka">© VKN 2026 💙</div>

<script>

let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;

function update(){
    document.getElementById("points").innerText =
        "⚡ " + points + " | Klik: " + clickPower + " | Auto: " + auto;
}

function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    update();
}

function click(){
    points += clickPower;
    save();

    let k = document.getElementById("clickBtn");
    k.classList.remove("spin");
    void k.offsetWidth;
    k.classList.add("spin");
}

document.getElementById("clickBtn").onclick = click;

document.addEventListener("keydown", e=>{
    if(e.code==="Space"){
        e.preventDefault();
        click();
    }
});

setInterval(()=>{
    if(auto>0){
        points+=auto;
        save();
    }
},1000);

update();

</script>

</body>
</html>
