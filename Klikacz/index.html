<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>GALACTIC CHAOS</title>

<style>
body {
    margin:0;
    background:black;
    color:lime;
    font-family:monospace;
    text-align:center;
    overflow:hidden;
}

/* 🌌 glitch tło */
body::before {
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05) 0px,
        rgba(0,255,0,0.05) 2px,
        transparent 2px,
        transparent 4px
    );
    animation: glitchbg 0.2s infinite;
}

@keyframes glitchbg {
    0% { transform:translate(0,0); }
    50% { transform:translate(5px,-5px); }
    100% { transform:translate(0,0); }
}

/* 🔥 GLITCH TEXT */
h1 {
    font-size:40px;
    animation: glitch 0.3s infinite;
}

@keyframes glitch {
    0% { text-shadow: 2px 0 red, -2px 0 blue; }
    50% { text-shadow: -2px 0 red, 2px 0 blue; }
    100% { text-shadow: 2px 0 red, -2px 0 blue; }
}

#points {
    font-size:25px;
    margin:20px;
}

/* 💥 KEBAB */
#kebab {
    width:200px;
    cursor:pointer;
    filter: drop-shadow(0 0 30px lime);
    transition:0.1s;
}

#kebab:active {
    transform:scale(0.9) rotate(10deg);
}

/* ⚡ przyciski */
button {
    margin:10px;
    padding:10px;
    background:black;
    color:lime;
    border:1px solid lime;
    cursor:pointer;
}

button:hover {
    background:lime;
    color:black;
}

/* 💀 glitch popup */
.glitch {
    position:absolute;
    color:red;
    font-size:30px;
    animation: spam 0.3s infinite;
}

@keyframes spam {
    0% { transform:translate(0,0); }
    50% { transform:translate(10px,-10px); }
    100% { transform:translate(0,0); }
}
</style>
</head>

<body>

<h1>💀 SYSTEM CHAOS 💀</h1>

<h2 id="points">0</h2>

<img src="Klik1.jpg" id="kebab">

<br><br>

<button onclick="goShop()">💎 SKLEP</button>

<script>

let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;

/* update */
function update(){
    document.getElementById("points").innerText = "Punkty: " + points;
}

/* save */
function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    update();
}

/* klik */
document.getElementById("kebab").onclick = () => {
    click();
};

/* SPACJA = klik */
document.addEventListener("keydown", (e)=>{
    if(e.code === "Space"){
        e.preventDefault();
        click();
    }
});

function click(){
    points += clickPower;
    save();

    // 💥 efekt glitch
    let el = document.createElement("div");
    el.className = "glitch";
    el.innerText = "+1";
    el.style.left = Math.random()*window.innerWidth + "px";
    el.style.top = Math.random()*window.innerHeight + "px";
    document.body.appendChild(el);

    setTimeout(()=> el.remove(), 500);
}

/* sklep */
function goShop(){
    window.location.href = "index2.html";
}

update();

</script>

</body>
</html>
