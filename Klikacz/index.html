<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Cosmic Clicker</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle, #020617, #000000);
    font-family: Arial;
    text-align:center;
    color:white;
}

h1 {
    margin-top:20px;
    font-size:40px;
    text-shadow: 0 0 15px cyan;
}

#stats {
    font-size:18px;
    margin-top:10px;
    color:cyan;
}

img {
    width:220px;
    margin-top:50px;
    cursor:pointer;
    filter: drop-shadow(0 0 20px cyan);
    transition:0.1s;
}

img:active {
    transform: scale(0.85);
}

.plus {
    position:absolute;
    color:cyan;
    font-size:25px;
    pointer-events:none;
    animation: floatUp 1s forwards;
}

@keyframes floatUp {
    0% { opacity:1; transform:translateY(0); }
    100% { opacity:0; transform:translateY(-80px); }
}

.stars {
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
}

.star {
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    animation: moveStar linear infinite;
}

@keyframes moveStar {
    from { transform: translateY(0); }
    to { transform: translateY(100vh); }
}

button {
    margin:10px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:cyan;
    font-weight:bold;
    cursor:pointer;
}

button:hover {
    background:white;
}
</style>

</head>

<body>

<h1 id="points">⚡ 0 ⚡</h1>
<div id="stats"></div>

<img src="Klik1.jpg" onclick="addPoint(event)">

<br>

<button onclick="goShop()">💎 Sklep</button>
<button onclick="goEvent()">👾 Event</button>

<div class="stars" id="stars"></div>

<script>
let points = parseInt(localStorage.getItem("points") || 0);
let clickPower = parseInt(localStorage.getItem("clickPower") || 1);
let auto = parseInt(localStorage.getItem("auto") || 0);

function updateUI(){
    document.getElementById("points").innerText = "⚡ " + points + " ⚡";
    document.getElementById("stats").innerText =
        "Klik: +" + clickPower + " | Auto: " + auto + "/s";
}

function addPoint(e) {
    points += clickPower;
    updateUI();
    save();

    let plus = document.createElement("div");
    plus.innerText = "+" + clickPower;
    plus.className = "plus";

    plus.style.left = e.clientX + "px";
    plus.style.top = e.clientY + "px";

    document.body.appendChild(plus);

    setTimeout(() => plus.remove(), 1000);
}

function save(){
    localStorage.setItem("points", points);
}

// AUTO CLICK
setInterval(() => {
    if(auto > 0){
        points += auto;
        updateUI();
        save();
    }
}, 1000);

// NAV
function goShop(){
    window.location.href = "index2.html";
}

function goEvent(){
    window.location.href = "index3.html";
}

// STARS
for(let i=0;i<100;i++){
    let star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random()*100 + "%";
    star.style.top = Math.random()*100 + "%";
    star.style.animationDuration = (Math.random()*5+3)+"s";

    document.getElementById("stars").appendChild(star);
}

updateUI();
</script>

</body>
</html>
