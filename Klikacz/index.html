<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Cosmic Clicker</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle, #020617, #000000);
    font-family: Arial;
    text-align:center;
    color:white;
}

h1 {
    margin-top:20px;
    font-size:40px;
    text-shadow: 0 0 15px cyan;
}

#stats {
    color:cyan;
}

img {
    width:220px;
    margin-top:50px;
    cursor:pointer;
    filter: drop-shadow(0 0 20px cyan);
}

.plus {
    position:absolute;
    color:cyan;
    font-size:25px;
    animation: floatUp 1s forwards;
}

@keyframes floatUp {
    0% { opacity:1; transform:translateY(0); }
    100% { opacity:0; transform:translateY(-80px); }
}

button {
    margin:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:cyan;
    cursor:pointer;
}
</style>
</head>

<body>

<h1 id="points">⚡ 0 ⚡</h1>
<div id="stats"></div>

<img src="Klik1.jpg" onclick="addPoint(event)">

<br>
<button onclick="location.href='index2.html'">💎 Sklep</button>
<button onclick="location.href='index3.html'">👾 Event</button>

<script>

let points = parseInt(localStorage.getItem("points") || 0);
let clickPower = parseInt(localStorage.getItem("clickPower") || 1);
let auto = parseInt(localStorage.getItem("auto") || 0);

let combo = 0;
let lastClick = 0;

function getMultiplier(){
    if(combo >= 20) return 5;
    if(combo >= 10) return 3;
    if(combo >= 5) return 2;
    return 1;
}

function updateUI(){
    document.getElementById("points").innerText = "⚡ " + points + " ⚡";
    document.getElementById("stats").innerText =
        "Klik: +" + clickPower + " | Auto: " + auto + "/s | Combo: " + combo;
}

function addPoint(e){
    let now = Date.now();

    if(now - lastClick < 300){
        combo++;
    } else {
        combo = 0;
    }

    lastClick = now;

    let gain = clickPower * getMultiplier();
    points += gain;

    updateUI();
    save();

    let plus = document.createElement("div");
    plus.innerText = "+" + gain;
    plus.className = "plus";

    plus.style.left = (e.clientX || window.innerWidth/2) + "px";
    plus.style.top = (e.clientY || window.innerHeight/2) + "px";

    document.body.appendChild(plus);
    setTimeout(() => plus.remove(), 1000);
}

function save(){
    localStorage.setItem("points", points);
}

// SPACE = CLICK
document.addEventListener("keydown", function(e){
    if(e.code === "Space"){
        e.preventDefault();

        addPoint({
            clientX: window.innerWidth/2,
            clientY: window.innerHeight/2
        });
    }
});

// AUTO CLICK
setInterval(()=>{
    if(auto > 0){
        points += auto;
        updateUI();
        save();
    }
},1000);

// RANDOM BONUS
setInterval(()=>{
    let bonus = Math.floor(Math.random()*5)+5;
    points += bonus;
    updateUI();
    save();
},10000);

updateUI();

</script>

</body>
</html>
