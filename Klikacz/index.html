<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Cosmic Clicker</title>

<style>
body {
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle, #020617, #000000);
    font-family: Arial;
    text-align:center;
    color:white;
}

h1 { font-size:40px; text-shadow:0 0 15px cyan; }

#stats { color:cyan; }

img {
    width:220px;
    cursor:pointer;
    filter: drop-shadow(0 0 20px cyan);
}

button {
    margin:10px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:cyan;
    cursor:pointer;
}
</style>
</head>

<body>

<h1 id="points"></h1>
<div id="stats"></div>

<img src="Klik1.jpg" onclick="addPoint(event)">

<br>
<button onclick="location.href='index2.html'">💎 Sklep</button>
<button onclick="location.href='index3.html'">👾 Event</button>

<script>

let points = parseInt(localStorage.getItem("points") || 0);
let clickPower = parseInt(localStorage.getItem("clickPower") || 1);
let auto = parseInt(localStorage.getItem("auto") || 0);
let rebirths = parseInt(localStorage.getItem("rebirths") || 0);

// 🔥 COMBO
let combo = 0;
let lastClick = 0;

function getMultiplier(){
    if(combo >= 20) return 5;
    if(combo >= 10) return 3;
    if(combo >= 5) return 2;
    return 1;
}

function updateUI(){
    document.getElementById("points").innerText = "⚡ " + points + " ⚡";
    document.getElementById("stats").innerText =
        "Klik: +" + clickPower +
        " | Auto: " + auto +
        " | 💀 Rebirthy: " + rebirths +
        " | Combo: " + combo;
}

function addPoint(e){
    let now = Date.now();

    if(now - lastClick < 300) combo++;
    else combo = 0;

    lastClick = now;

    let gain = (clickPower + rebirths) * getMultiplier();
    points += gain;

    updateUI();
    save();
}

function save(){
    localStorage.setItem("points", points);
}

// SPACE CLICK
document.addEventListener("keydown", e=>{
    if(e.code === "Space"){
        e.preventDefault();
        addPoint({clientX:0, clientY:0});
    }
});

// AUTO
setInterval(()=>{
    if(auto > 0){
        points += auto + rebirths;
        updateUI();
        save();
    }
},1000);

// BONUS
setInterval(()=>{
    let bonus = Math.floor(Math.random()*10)+10;
    points += bonus;
    updateUI();
    save();
},10000);

updateUI();

</script>

</body>
</html>
