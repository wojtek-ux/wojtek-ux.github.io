<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Galactic Clicker</title>

<style>
body {
    margin:0;
    background:#000;
    color:cyan;
    font-family:Arial;
    text-align:center;
    user-select:none;
}

/* 🔥 OVERLAY (NAPRAWIONY) */
.overlay {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size:40px 40px;
    animation: stars 40s linear infinite;
    opacity:0.15;

    pointer-events:none; /* 💀 NAJWAŻNIEJSZE */
    z-index:0;
}

@keyframes stars {
    from {transform:translate(0,0);}
    to {transform:translate(-400px,-400px);}
}

/* 🌯 obrazek */
#clickBtn {
    width:220px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 0 40px cyan;
    transition:0.2s;
    position:relative;
    z-index:1;
}

#clickBtn:active {
    transform:scale(0.9);
}

/* 🔘 sklep */
.shopBtn {
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:cyan;
    border-radius:10px;
    font-weight:bold;
    text-decoration:none;
    color:black;
    position:relative;
    z-index:1;
}

.shopBtn:active {
    transform:scale(0.95);
}

h1, h2 {
    position:relative;
    z-index:1;
}
</style>
</head>

<body>

<!-- 🔥 overlay -->
<div class="overlay"></div>

<h1>🚀 CLICKER 🚀</h1>

<h2 id="points">0</h2>

<img src="Klik1.jpg" id="clickBtn">

<br><br>

<a href="index2.html" class="shopBtn">💎 SKLEP</a>

<script>

let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;

function update(){
    document.getElementById("points").innerText =
        "⚡ " + points + " | Klik: " + clickPower + " | Auto: " + auto;
}

function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    update();
}

function click(){
    points += clickPower;
    save();
}

document.getElementById("clickBtn").onclick = click;

document.addEventListener("keydown", (e)=>{
    if(e.code === "Space"){
        e.preventDefault();
        click();
    }
});

setInterval(()=>{
    if(auto > 0){
        points += auto;
        save();
    }
},1000);

update();

</script>

</body>
</html>
