<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Galactic Clicker</title>

<style>
body {
    margin:0;
    color:cyan;
    font-family:Arial;
    text-align:center;
    user-select:none;
    overflow:hidden;

    /* 🌌 GWIAZDY */
    background:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(white 1px, transparent 1px),
    black;

    background-size:40px 40px, 60px 60px;
    background-position:0 0, 20px 20px;

    animation: moveStars 20s linear infinite;
}

@keyframes moveStars {
    from {
        background-position:0 0, 20px 20px;
    }
    to {
        background-position:0 1000px, 20px 1020px;
    }
}

/* 🌯 KEBAB */
#clickBtn {
    width:220px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 0 40px cyan;
    transition:0.2s;
}

/* 🔥 obrót */
.spin {
    animation: spin 0.5s linear;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 🔘 sklep */
.shopBtn {
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:cyan;
    border-radius:10px;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

.shopBtn:active {
    transform:scale(0.95);
}
</style>
</head>

<body>

<h1>🚀 CLICKER 🚀</h1>

<h2 id="points">0</h2>

<img src="Klik1.jpg" id="clickBtn">

<br><br>

<a href="index2.html" class="shopBtn">💎 SKLEP</a>

<script>

let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;

function update(){
    document.getElementById("points").innerText =
        "⚡ " + points + " | Klik: " + clickPower + " | Auto: " + auto;
}

function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    update();
}

/* 🌯 klik */
function click(){
    points += clickPower;
    save();

    let kebab = document.getElementById("clickBtn");

    // 🔥 obrót
    kebab.classList.remove("spin");
    void kebab.offsetWidth; // reset animacji
    kebab.classList.add("spin");
}

document.getElementById("clickBtn").onclick = click;

/* ⌨️ SPACJA */
document.addEventListener("keydown", (e)=>{
    if(e.code === "Space"){
        e.preventDefault();
        click();
    }
});

/* ⚡ AUTO */
setInterval(()=>{
    if(auto > 0){
        points += auto;
        save();
    }
},1000);

update();

</script>

</body>
</html>
