<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Galactic Clicker</title>

<style>
body {
    margin:0;
    background: radial-gradient(circle, #020617, #000);
    color:cyan;
    font-family:Arial;
    text-align:center;
    user-select:none; /* 🔥 blokuje zaznaczanie */
}

/* ✨ gwiazdy */
body::before {
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size:40px 40px;
    animation: stars 40s linear infinite;
    opacity:0.15;
}

@keyframes stars {
    from {transform:translate(0,0);}
    to {transform:translate(-400px,-400px);}
}

/* 🌯 obrazek */
#clickBtn {
    width:220px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 0 40px cyan;
    transition:0.2s;
}

#clickBtn:active {
    transform:scale(0.9);
}

/* 🔘 przycisk sklep */
.shopBtn {
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    background:cyan;
    border-radius:10px;
    font-weight:bold;
    text-decoration:none;
    color:black;
}

.shopBtn:active {
    transform:scale(0.95);
}
</style>
</head>

<body>

<h1>🚀 CLICKER 🚀</h1>

<h2 id="points">0</h2>

<img src="Klik1.jpg" id="clickBtn">

<br><br>

<!-- 🔥 NA PEWNO DZIAŁA -->
<a href="index2.html" class="shopBtn">💎 SKLEP</a>

<script>

/* dane */
let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;

/* update */
function update(){
    document.getElementById("points").innerText =
        "⚡ " + points + " | Klik: " + clickPower + " | Auto: " + auto;
}

/* save */
function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    update();
}

/* klik */
function click(){
    points += clickPower;
    save();
}

/* klik myszką */
document.getElementById("clickBtn").onclick = click;

/* SPACJA */
document.addEventListener("keydown", (e)=>{
    if(e.code === "Space"){
        e.preventDefault();
        click();
    }
});

/* AUTO */
setInterval(()=>{
    if(auto > 0){
        points += auto;
        save();
    }
},1000);

/* start */
update();

</script>

</body>
</html>
