<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Galactic Clicker</title>

<style>
body {
    margin:0;
    background: radial-gradient(circle, #020617, #000);
    color:cyan;
    font-family:Orbitron, monospace;
    text-align:center;
    overflow:hidden;
}

/* ✨ gwiazdy */
body::before {
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size:40px 40px;
    animation: stars 40s linear infinite;
    opacity:0.15;
}

@keyframes stars {
    from {transform:translate(0,0);}
    to {transform:translate(-400px,-400px);}
}

/* 🔥 tytuł */
h1 {
    text-shadow:0 0 15px cyan, 0 0 40px blue;
}

/* 💎 punkty */
#points {
    font-size:25px;
    margin:20px;
}

/* 💥 przycisk */
#clickBtn {
    width:180px;
    height:180px;
    border-radius:50%;
    background:linear-gradient(45deg, #00ffff, #0044ff);
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 25px cyan;
    transition:0.2s;
}

#clickBtn:hover {
    transform:scale(1.1);
    box-shadow:0 0 50px cyan;
}

#clickBtn:active {
    transform:scale(0.9);
}

/* ⚡ przyciski */
button {
    margin:10px;
    padding:10px;
    background:cyan;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover {
    background:white;
}
</style>
</head>

<body>

<h1>🚀 GALACTIC CLICKER 🚀</h1>

<h2 id="points">Ładowanie...</h2>

<img src="Klik1.jpg" id="clickBtn">

<br><br>

<button onclick="goShop()">💎 Sklep</button>
<button onclick="reset()">💀 Reset</button>

<script>

/* 🔥 dane */
let points = Number(localStorage.getItem("points")) || 0;
let clickPower = Number(localStorage.getItem("clickPower")) || 1;
let auto = Number(localStorage.getItem("auto")) || 0;

/* update UI */
function update(){
    document.getElementById("points").innerText =
        "⚡ " + points + " | Klik: " + clickPower + " | Auto: " + auto;
}

/* zapis */
function save(){
    localStorage.setItem("points", points);
    localStorage.setItem("clickPower", clickPower);
    localStorage.setItem("auto", auto);
    update();
}

/* 🖱️ klik */
function click(){
    points += clickPower;
    save();

    // efekt +1
    let el = document.createElement("div");
    el.innerText = "+" + clickPower;
    el.style.position = "absolute";
    el.style.left = (window.innerWidth/2 + Math.random()*100-50)+"px";
    el.style.top = (window.innerHeight/2 + Math.random()*100-50)+"px";
    el.style.color = "cyan";
    el.style.fontSize = "20px";
    document.body.appendChild(el);

    setTimeout(()=>el.remove(), 400);
}

/* klik przyciskiem */
document.getElementById("clickBtn").onclick = click;

/* ⌨️ SPACJA */
document.addEventListener("keydown", (e)=>{
    if(e.code === "Space"){
        e.preventDefault();
        click();
    }
});

/* ⚡ AUTO KLIK */
setInterval(()=>{
    if(auto > 0){
        points += auto;
        save();
    }
}, 1000);

/* 🛒 sklep */
function goShop(){
    window.location.href = "index2.html";
}

/* 💀 reset */
function reset(){
    if(confirm("Na pewno chcesz reset?")){
        localStorage.clear();
        location.reload();
    }
}

/* start */
update();

</script>

</body>
</html>
