<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Quiz Hacker</title>

<style>
body {
    margin:0;
    background:black;
    color:#00ffcc;
    font-family:monospace;
    text-align:center;
    overflow:hidden;
}

/* TŁO */
body::before {
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background: url("https://www.transparenttextures.com/patterns/stardust.png");
    animation: moveBg 20s linear infinite;
    opacity:0.3;
}

@keyframes moveBg {
    from { background-position:0 0; }
    to { background-position:1000px 1000px; }
}

/* BOX */
.container {
    position:relative;
    top:50%;
    transform:translateY(-50%);
    background: rgba(0,0,0,0.8);
    border-radius:20px;
    padding:30px;
    width:300px;
    margin:auto;
    box-shadow:0 0 25px #00ffcc;
}

/* TYTUŁ */
h1 {
    text-shadow:0 0 10px #00ffcc;
}

/* PYTANIE */
#question {
    margin:20px 0;
    font-size:18px;
}

/* PRZYCISKI */
button {
    display:block;
    margin:10px auto;
    padding:10px;
    width:220px;
    border:none;
    border-radius:10px;
    background:#001f1f;
    color:#00ffcc;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    background:#00ffcc;
    color:black;
    transform:scale(1.05);
    box-shadow:0 0 15px #00ffcc;
}

/* WYNIK */
.result {
    font-size:25px;
    text-shadow:0 0 15px #00ffcc;
}

/* STOPKA */
footer {
    position: fixed;
    bottom: 10px;
    width: 100%;
    font-size: 14px;
    color: #00ffcc;
    opacity: 0.7;
    text-shadow: 0 0 5px #00ffcc;
    animation: flicker 2s infinite alternate;
}

/* LEKKA ANIMACJA */
@keyframes flicker {
    from { opacity: 0.5; }
    to { opacity: 1; text-shadow: 0 0 15px #00ffcc; }
}
</style>

</head>

<body>

<div class="container">
<h1>🧠 QUIZ</h1>
<div id="question"></div>
<div id="answers"></div>
</div>

<footer id="footer"></footer>

<script>

let quiz = [
{q:"Najlepsza gra?", a:["Roblox","Minecraft","Fortnite"], c:0},
{q:"Co robi hacker?", a:["Gotuje","Programuje","Śpi"], c:1},
{q:"HTML to?", a:["Język","Gra","Program"], c:0},
{q:"CSS służy do?", a:["Stylu","Gier","Muzyki"], c:0},
{q:"JS to?", a:["JavaScript","Java","JustStyle"], c:0}
];

let i = 0;
let score = 0;

function load(){
    let q = quiz[i];
    document.getElementById("question").innerText = q.q;

    let html = "";
    q.a.forEach((ans, index)=>{
        html += `<button onclick="answer(${index})">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
}

function answer(x){
    if(x === quiz[i].c) score++;

    i++;

    if(i < quiz.length){
        load();
    } else {
        document.querySelector(".container").innerHTML =
        `<div class="result">🔥 Wynik: ${score}/${quiz.length} 🔥</div>`;
    }
}

/* AUTO ROK */
document.getElementById("footer").innerText =
"© VKN " + new Date().getFullYear();

load();

</script>

</body>
</html>
