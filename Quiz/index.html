<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
body {
    background:black;
    color:lime;
    font-family:monospace;
    text-align:center;
    padding-top:50px;
}

button {
    display:block;
    margin:10px auto;
    padding:10px;
    width:200px;
}
</style>

</head>

<body>

<h1>🧠 QUIZ</h1>

<div id="question"></div>
<div id="answers"></div>

<script>

let quiz = [

{q:"Najlepsza gra?", a:["Roblox","Minecraft","Fortnite"], c:0},
{q:"Co robi hacker?", a:["Gotuje","Programuje","Śpi"], c:1},
{q:"HTML to?", a:["Język","Gra","Program"], c:0},
{q:"CSS służy do?", a:["Stylu","Gier","Muzyki"], c:0},
{q:"JS to?", a:["JavaScript","Java","JustStyle"], c:0},
{q:"CPU to?", a:["Procesor","Gra","Program"], c:0},
{q:"GPU to?", a:["Karta graficzna","Procesor","RAM"], c:0},
{q:"RAM to?", a:["Pamięć","Dysk","Grafika"], c:0},
{q:"IP to?", a:["Adres","Hasło","Plik"], c:0},
{q:"WWW to?", a:["Strona","Gra","Kod"], c:0},

{q:"Najlepszy język?", a:["JS","Python","C++"], c:0},
{q:"Discord to?", a:["App","Gra","System"], c:0},
{q:"YouTube to?", a:["Video","Gra","Kod"], c:0},
{q:"TikTok to?", a:["App","Program","System"], c:0},
{q:"Windows to?", a:["System","Gra","Kod"], c:0},
{q:"Linux to?", a:["System","Gra","Przeglądarka"], c:0},
{q:"GitHub to?", a:["Strona kodu","Gra","Chat"], c:0},
{q:"Roblox Studio to?", a:["Tworzenie gier","Gra","System"], c:0},
{q:"Plugin to?", a:["Dodatek","Gra","Kod"], c:0},
{q:"Serwer to?", a:["Maszyna","Gra","Program"], c:0}

];
    
let i = 0;
let score = 0;

function load(){
    let q = quiz[i];
    document.getElementById("question").innerText = q.q;

    let html = "";
    q.a.forEach((ans, index)=>{
        html += `<button onclick="answer(${index})">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
}

function answer(x){
    if(x === quiz[i].c) score++;

    i++;

    if(i < quiz.length){
        load();
    } else {
        document.body.innerHTML = `<h1>Twój wynik: ${score}/${quiz.length}</h1>`;
    }
}

load();

</script>

</body>
</html>
