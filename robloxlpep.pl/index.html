<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Roblox Live Players</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

.big{
    font-size:50px;
    margin:20px;
    color:#22c55e;
}
</style>
</head>

<body>

<h1>🎮 Roblox Live Players</h1>

<div class="big" id="total">0</div>

<script>

// 🔥 start albo zapis
let displayed = parseInt(localStorage.getItem("players")) || 90000000;
let adds = parseInt(localStorage.getItem("adds")) || 0;

// 🔥 update UI
function update(){
    document.getElementById("total").innerText =
        "👥 " + displayed.toLocaleString();
}

// 🔥 główna logika
setInterval(()=>{

    displayed += 200;
    adds++;

    // 💀 co 500 dodaniach odejmij
    if(adds >= 500){
        displayed -= 700;
        adds = 0;
    }

    // 🔥 zapisz
    localStorage.setItem("players", displayed);
    localStorage.setItem("adds", adds);

    update();

}, 2000);

// start
update();

</script>

</body>
</html>
