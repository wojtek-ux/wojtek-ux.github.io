<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Roblox Live Players</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    text-align:center;
}

.big{
    font-size:50px;
    margin:20px;
    color:#22c55e;
}

.info{
    color:#aaa;
    margin-bottom:20px;
}

canvas{
    max-width:600px;
    margin:auto;
}
</style>
</head>

<body>

<h1>🎮 Roblox Live Players</h1>

<div class="big" id="total">0</div>

<div class="info">
📊 Szacowana liczba graczy (pseudo live)
</div>

<canvas id="chart"></canvas>

<script>

let displayed = 0;
let chart;
let dataPoints = [];
let labels = [];

/* 🔥 płynny licznik */
function smoothIncrease(target){

    let speed = (target - displayed) / 50;

    let interval = setInterval(()=>{
        displayed += speed;

        if(Math.abs(target - displayed) < 10){
            displayed = target;
            clearInterval(interval);
        }

        document.getElementById("total").innerText =
            "👥 " + Math.floor(displayed).toLocaleString();

    }, 50);
}

/* 🔥 pseudo dane */
function generatePlayers(){

    let base = 1800000; // baza
    let random = Math.floor(Math.random()*100000);

    return base + random;
}

/* 🔥 update */
function load(){

    let totalPlayers = generatePlayers();

    smoothIncrease(totalPlayers);

    let time = new Date().toLocaleTimeString();

    labels.push(time);
    dataPoints.push(totalPlayers);

    if(labels.length > 12){
        labels.shift();
        dataPoints.shift();
    }

    if(!chart){
        chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: {
                labels: labels,
                datasets: [{
                    label: "Gracze",
                    data: dataPoints,
                    borderWidth: 2,
                    tension: 0.3
                }]
            }
        });
    } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = dataPoints;
        chart.update();
    }
}

/* 🔥 mikro ruch (żeby wyglądało ultra real) */
setInterval(()=>{
    displayed += Math.random()*20 - 10;
    document.getElementById("total").innerText =
        "👥 " + Math.floor(displayed).toLocaleString();
}, 200);

/* 🔄 większe update */
setInterval(load, 5000);

load();

</script>

</body>
</html>
