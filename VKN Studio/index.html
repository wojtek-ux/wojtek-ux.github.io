<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>VKN Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
    }

    header {
      padding: 40px;
      font-size: 40px;
      font-weight: bold;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00f; }
      to { text-shadow: 0 0 20px #0ff; }
    }

    .card {
      background: #1e293b;
      margin: 20px auto;
      padding: 20px;
      width: 300px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,255,255,0.2);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0,255,255,0.5);
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: cyan;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: white;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      font-size: 14px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>🔥 VKN PROJECT 🔥</header>

<div class="card">
  <h2>O mnie</h2>
  <p>Tworzę rzeczy do Roblox, Discord boty i różne kozackie projekty 😎</p>
</div>

<div class="card">
  <h2>Moje projekty</h2>
  <p>• Roblox Scripts<br>• Discord Bot<br>• Edity 🔥</p>
  <button onclick="window.location.href='index2.html'">
  Zobacz więcej
</button>
</div>

<div class="card">
  <h2>Kontakt</h2>
  <p>Discord: wojtek2_</p>
  <p>Lub grupa Discord : discord.gg/ndUFVMBYNY</p>
</div>

<footer>
  © 2026 VKN | Zrobione z nudów ale wyszło kozacko 💀
</footer>

</body>
</html>
