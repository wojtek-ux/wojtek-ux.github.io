<!DOCTYPE html>
<html lang="pl">
<head>

  <title>Moje Projekty</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      text-align: center;
    }

    header {
      padding: 30px;
      font-size: 35px;
      font-weight: bold;
    }

    .box {
      background: #1e293b;
      margin: 20px auto;
      padding: 20px;
      width: 320px;
      border-radius: 20px;
      transition: 0.3s;
    }

    .box:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px cyan;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: cyan;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: white;
    }
  </style>
</head>

<body>

<header>🚀 Moje Projekty 🚀</header>

<div class="box">
  <h2>🎮 Roblox</h2>
  <p>Tworzę gry i systemy (npc, itemy, skrypty)</p>
</div>

<div class="box">
  <h2>⛏️ Serwery MC</h2>
  <p>Komendy, pluginy, Skript i różne systemy</p>
</div>

<div class="box">
  <h2>🎧 Muzyka</h2>
  <p>Edity, bass boosted, viral vibes 🔥</p>
</div>

  ⬅ Powrót
</button>

</body>
</html>
