<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>UNO ULTRA 😈🔥</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(180deg,#0f172a,#020617);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

/* 🔥 MENU */

.menu{
    position:fixed;
    top:0;
    width:100%;
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
    padding:15px;
    z-index:999;
}

.menu button{
    margin:5px;
}

/* 🃏 */

h1{
    margin-top:90px;
    font-size:55px;
}

#turn{
    color:#22c55e;
}

.info{
    margin:10px;
    color:#94a3b8;
    font-size:18px;
}

.card{
    width:90px;
    height:130px;
    border-radius:15px;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    margin:5px;
    cursor:pointer;
    transition:0.25s;
    font-weight:bold;
    user-select:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    animation:spawn 0.3s;
}

@keyframes spawn{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.card:hover{
    transform:translateY(-10px) scale(1.08);
}

.red{ background:#ef4444; }
.blue{ background:#3b82f6; }
.green{ background:#22c55e; }
.yellow{ background:#eab308; color:black; }
.black{
    background:black;
    color:white;
}

.centerCard{
    transform:scale(1.2);
    box-shadow:0 0 30px rgba(255,255,255,0.3);
}

#hand{
    margin-top:40px;
}

/* 🔘 */

button{
    padding:12px 24px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.draw{
    background:#38bdf8;
}

.uno{
    background:#ef4444;
    color:white;
}

.restart{
    background:#22c55e;
}

/* 🏆 */

.win{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-size:50px;
    z-index:9999;
    animation:fade 0.4s;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

/* 📊 */

.stats{
    margin-top:10px;
    color:#94a3b8;
}

</style>
</head>

<body>

<!-- 🔥 MENU -->
<div class="menu">

<button onclick="restartGame()" class="restart">
🔄 Restart
</button>

<button onclick="toggleMusic()">
🎵 Muzyka
</button>

<button onclick="toggleTheme()">
🌙 Motyw
</button>

</div>

<h1>🃏 UNO ULTRA</h1>

<h2 id="turn">🫵 Twoja tura</h2>

<div class="info">
🤖 Bot ma:
<span id="botCards">7</span>
kart
</div>

<div class="stats">
🏆 Wygrane:
<span id="wins">0</span>
|
💀 Przegrane:
<span id="loses">0</span>
</div>

<div id="table"></div>

<button class="draw" onclick="drawCard()">
➕ Dobierz
</button>

<button class="uno" onclick="sayUNO()">
UNO!
</button>

<h2>Twoje karty</h2>

<div id="hand"></div>

<!-- 🔊 AUDIO -->
<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8c8a73467.mp3">
</audio>

<script>

/* 🔥 DANE */

const colors = ["red","blue","green","yellow"];
const specials = ["+2","🌈"];

let player = [];
let bot = [];
let currentCard;
let playerTurn = true;

let wins = parseInt(localStorage.getItem("wins")) || 0;
let loses = parseInt(localStorage.getItem("loses")) || 0;

winsEl.innerText = wins;
losesEl.innerText = loses;

/* 🎴 RANDOM CARD */

function randomCard(){

    let chance = Math.random();

    // ✨ SPECIAL
    if(chance < 0.25){

        let type =
            specials[Math.floor(Math.random()*specials.length)];

        return {
            color: type === "🌈"
                ? "black"
                : colors[Math.floor(Math.random()*colors.length)],

            special:type
        };
    }

    // 🔢 NORMAL
    return {
        color: colors[Math.floor(Math.random()*colors.length)],
        number: Math.floor(Math.random()*10)
    };
}

/* 🚀 START */

function start(){

    player = [];
    bot = [];

    for(let i=0;i<7;i++){
        player.push(randomCard());
        bot.push(randomCard());
    }

    currentCard = randomCard();

    render();
}

/* 🎨 TEXT */

function cardText(c){
    return c.special || c.number;
}

/* 🎴 RENDER */

function render(){

    botCards.innerText = bot.length;

    table.innerHTML = `
    <div class="card centerCard ${currentCard.color}">
        ${cardText(currentCard)}
    </div>
    `;

    hand.innerHTML = "";

    player.forEach((c,index)=>{

        let playable = canPlay(c);

        hand.innerHTML += `
        <div
            class="card ${c.color}"
            style="opacity:${playable ? 1 : 0.4}"
            onclick="play(${index})"
        >
            ${cardText(c)}
        </div>
        `;
    });

}

/* ✅ RULES */

function canPlay(c){

    if(c.special === "🌈") return true;

    if(c.color === currentCard.color) return true;

    if(
        c.number !== undefined &&
        currentCard.number !== undefined &&
        c.number === currentCard.number
    ){
        return true;
    }

    if(
        c.special &&
        currentCard.special &&
        c.special === currentCard.special
    ){
        return true;
    }

    return false;
}

/* 🎮 PLAY */

window.play = function(index){

    if(!playerTurn) return;

    let c = player[index];

    if(!canPlay(c)) return;

    currentCard = {...c};

    player.splice(index,1);

    // ➕2
    if(c.special === "+2"){
        bot.push(randomCard());
        bot.push(randomCard());
    }

    // 🌈
    if(c.special === "🌈"){
        currentCard.color =
            colors[Math.floor(Math.random()*colors.length)];
    }

    render();

    // 🃏 UNO
    if(player.length === 1){
        turn.innerText = "⚠️ UNO!";
    }

    // 🏆 WIN
    if(player.length <= 0){

        wins++;
        localStorage.setItem("wins",wins);

        winsEl.innerText = wins;

        showWin("🔥 WYGRAŁEŚ!");

        return;
    }

    playerTurn = false;

    botTurn();
}

/* 🤖 BOT */

function botTurn(){

    turn.innerText = "🤖 Tura bota";

    setTimeout(()=>{

        let played = false;

        for(let i=0;i<bot.length;i++){

            let c = bot[i];

            if(canPlay(c)){

                currentCard = {...c};

                bot.splice(i,1);

                played = true;

                // ➕2
                if(c.special === "+2"){
                    player.push(randomCard());
                    player.push(randomCard());
                }

                // 🌈
                if(c.special === "🌈"){
                    currentCard.color =
                        colors[Math.floor(Math.random()*colors.length)];
                }

                break;
            }

        }

        if(!played){
            bot.push(randomCard());
        }

        render();

        // 💀 LOSE
        if(bot.length <= 0){

            loses++;
            localStorage.setItem("loses",loses);

            losesEl.innerText = loses;

            showWin("💀 BOT WYGRAŁ!");

            return;
        }

        playerTurn = true;

        turn.innerText = "🫵 Twoja tura";

    },1000);

}

/* ➕ DRAW */

window.drawCard = function(){

    if(!playerTurn) return;

    player.push(randomCard());

    render();

    playerTurn = false;

    botTurn();
}

/* 🃏 UNO */

window.sayUNO = function(){

    if(player.length === 1){
        alert("🔥 UNO!");
    }else{
        alert("💀 Nie możesz teraz!");
    }

}

/* 🏆 END */

function showWin(text){

    document.body.innerHTML += `
    <div class="win">
        <div>${text}</div>

        <button
        class="restart"
        onclick="restartGame()"
        >
        🔄 Graj ponownie
        </button>
    </div>
    `;
}

/* 🔄 RESET */

window.restartGame = function(){
    location.reload();
}

/* 🎵 MUSIC */

let musicOn = false;

window.toggleMusic = function(){

    let m = document.getElementById("music");

    if(!musicOn){
        m.play();
        musicOn = true;
    }else{
        m.pause();
        musicOn = false;
    }

}

/* 🌙 THEME */

let dark = true;

window.toggleTheme = function(){

    if(dark){

        document.body.style.background =
            "linear-gradient(180deg,#f8fafc,#cbd5e1)";

        document.body.style.color = "black";

    }else{

        document.body.style.background =
            "linear-gradient(180deg,#0f172a,#020617)";

        document.body.style.color = "white";
    }

    dark = !dark;
}

start();

</script>

</body>
</html>
