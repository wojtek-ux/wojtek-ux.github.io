<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>UNO V3 💀🔥</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    overflow-x:hidden;
}

h1{
    margin-top:20px;
    font-size:50px;
}

#turn{
    margin-top:10px;
    color:#22c55e;
}

#table{
    margin-top:30px;
}

.centerCard{
    transform:scale(1.2);
}

.card{
    width:90px;
    height:130px;
    border-radius:15px;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    margin:5px;
    cursor:pointer;
    transition:0.25s;
    font-weight:bold;
    user-select:none;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.card:hover{
    transform:translateY(-12px) scale(1.08);
}

.red{ background:#ef4444; }
.blue{ background:#3b82f6; }
.green{ background:#22c55e; }
.yellow{ background:#eab308; color:black; }
.black{
    background:black;
    color:white;
}

#hand{
    margin-top:40px;
}

button{
    padding:12px 24px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:17px;
    margin:10px;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

.draw{
    background:#38bdf8;
}

.uno{
    background:#ef4444;
    color:white;
    font-weight:bold;
}

.info{
    color:#94a3b8;
    margin-top:10px;
    font-size:18px;
}

.win{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    z-index:999;
}
</style>
</head>

<body>

<h1>🃏 UNO V3</h1>

<h2 id="turn">🫵 Twoja tura</h2>

<div class="info">
🤖 Bot ma: <span id="botCards">7</span> kart
</div>

<div id="table"></div>

<button class="draw" onclick="drawCard()">➕ Dobierz</button>
<button class="uno" onclick="sayUNO()">UNO!</button>

<h2>Twoje karty</h2>

<div id="hand"></div>

<script>

const colors = ["red","blue","green","yellow"];
const specials = ["+2","🚫","🌈"];

let player = [];
let bot = [];
let currentCard;
let playerTurn = true;

/* 🔥 RANDOM CARD */
function randomCard(){

    let chance = Math.random();

    // ✨ special
    if(chance < 0.25){

        let type = specials[Math.floor(Math.random()*specials.length)];

        return {
            color: type === "🌈"
                ? "black"
                : colors[Math.floor(Math.random()*colors.length)],

            special:type
        };
    }

    // 🔢 normal
    return {
        color: colors[Math.floor(Math.random()*colors.length)],
        number: Math.floor(Math.random()*10)
    };
}

/* 🚀 START */
function start(){

    for(let i=0;i<7;i++){
        player.push(randomCard());
        bot.push(randomCard());
    }

    currentCard = randomCard();

    render();
}

/* 📝 TEXT */
function cardText(c){
    return c.special || c.number;
}

/* 🎨 RENDER */
function render(){

    botCards.innerText = bot.length;

    table.innerHTML = `
    <div class="card centerCard ${currentCard.color}">
        ${cardText(currentCard)}
    </div>
    `;

    hand.innerHTML = "";

    player.forEach((c,index)=>{

        let playable = canPlay(c);

        hand.innerHTML += `
        <div
            class="card ${c.color}"
            style="
            opacity:${playable ? 1 : 0.4};
            "
            onclick="play(${index})"
        >
            ${cardText(c)}
        </div>
        `;
    });

}

/* ✅ UNO RULES */
function canPlay(c){

    // 🌈 zawsze można
    if(c.special === "🌈") return true;

    // 🎨 kolor
    if(c.color === currentCard.color) return true;

    // 🔢 liczby
    if(
        c.number !== undefined &&
        currentCard.number !== undefined &&
        c.number === currentCard.number
    ){
        return true;
    }

    // ✨ speciale
    if(
        c.special &&
        currentCard.special &&
        c.special === currentCard.special
    ){
        return true;
    }

    return false;
}

/* 🎮 PLAY */
window.play = function(index){

    if(!playerTurn) return;

    let c = player[index];

    if(!canPlay(c)) return;

    currentCard = {...c};

    player.splice(index,1);

    // ➕2
    if(c.special === "+2"){
        bot.push(randomCard());
        bot.push(randomCard());
    }

    // 🌈 wild
    if(c.special === "🌈"){
        currentCard.color =
            colors[Math.floor(Math.random()*colors.length)];
    }

    render();

    // 🃏 UNO
    if(player.length === 1){
        turn.innerText = "⚠️ Powiedz UNO!";
    }

    // 🏆 WIN
    if(player.length <= 0){
        showWin("🔥 WYGRAŁEŚ!");
        return;
    }

    // 🚫 SKIP
    if(c.special === "🚫"){
        turn.innerText = "😈 Pominąłeś bota!";
        return;
    }

    playerTurn = false;

    botTurn();
}

/* 🤖 BOT */
function botTurn(){

    turn.innerText = "🤖 Tura bota";

    setTimeout(()=>{

        let played = false;

        for(let i=0;i<bot.length;i++){

            let c = bot[i];

            if(canPlay(c)){

                currentCard = {...c};

                bot.splice(i,1);

                played = true;

                // ➕2
                if(c.special === "+2"){
                    player.push(randomCard());
                    player.push(randomCard());
                }

                // 🌈
                if(c.special === "🌈"){
                    currentCard.color =
                        colors[Math.floor(Math.random()*colors.length)];
                }

                // 🚫 skip
                if(c.special === "🚫"){

                    render();

                    if(bot.length <= 0){
                        showWin("💀 BOT WYGRAŁ!");
                    }

                    turn.innerText =
                        "💀 Bot pominął twoją turę!";

                    return;
                }

                break;
            }

        }

        // ❌ bot nie ma karty
        if(!played){
            bot.push(randomCard());
        }

        render();

        // 🏆 WIN
        if(bot.length <= 0){
            showWin("💀 BOT WYGRAŁ!");
            return;
        }

        playerTurn = true;

        turn.innerText = "🫵 Twoja tura";

    },1200);

}

/* ➕ DRAW */
window.drawCard = function(){

    if(!playerTurn) return;

    player.push(randomCard());

    render();

    playerTurn = false;

    botTurn();
}

/* 🃏 UNO */
window.sayUNO = function(){

    if(player.length === 1){
        alert("🔥 UNO!");
    }else{
        alert("💀 Nie możesz teraz powiedzieć UNO");
    }

}

/* 🏆 END */
function showWin(text){

    document.body.innerHTML += `
    <div class="win">
        ${text}
    </div>
    `;
}

start();

</script>

</body>
</html>
