<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Nauka kolorów - słuchanie</title>

<style>
body {
    margin:0;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(135deg,#ff9a9e,#a1c4fd);
    color:white;
}

h1 {
    margin-top:40px;
}

/* 🔊 kontrolki */
.controls {
    margin-top:20px;
}

.ctrlBtn {
    display:inline-block;
    margin:10px;
    padding:15px 25px;
    font-size:25px;
    background:white;
    color:black;
    border-radius:15px;
    cursor:pointer;
    transition:0.2s;
}

.ctrlBtn:hover {
    transform:scale(1.1);
}

/* 🎨 wybory */
.choices {
    margin-top:50px;
}

.choice {
    display:inline-block;
    width:120px;
    height:120px;
    margin:10px;
    border-radius:20px;
    cursor:pointer;
    transition:0.2s;
}

.choice:hover {
    transform:scale(1.1);
    box-shadow:0 0 20px rgba(255,255,255,0.7);
}

/* ⭐ wynik */
#score {
    margin-top:20px;
    font-size:20px;
}
</style>
</head>

<body>

<h1>🎨 Posłuchaj i wybierz kolor 🎨</h1>

<!-- 🔊 kontrolki -->
<div class="controls">
    <div class="ctrlBtn" onclick="repeat()">🔊</div>
    <div class="ctrlBtn" onclick="slow()">🐢</div>
</div>

<div class="choices">
    <div class="choice" onclick="check(this)"></div>
    <div class="choice" onclick="check(this)"></div>
    <div class="choice" onclick="check(this)"></div>
</div>

<div id="score">⭐ 0</div>

<script>

let correct = "";
let score = 0;

/* 🎨 kolory */
let colors = [
    {name:"czerwony", color:"red"},
    {name:"niebieski", color:"blue"},
    {name:"zielony", color:"green"},
    {name:"żółty", color:"yellow"},
    {name:"różowy", color:"pink"},
    {name:"fioletowy", color:"purple"},
    {name:"pomarańczowy", color:"orange"}
];

/* 🔊 mówienie */
function speak(text, rate=1){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "pl-PL";
    msg.rate = rate;
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
}

/* 🔁 powtórz */
function repeat(){
    speak("znajdź kolor " + correct);
}

/* 🐢 wolno */
function slow(){
    speak("znajdź kolor " + correct, 0.6);
}

/* 🎯 nowa runda */
function newRound(){

    let c = colors[Math.floor(Math.random()*colors.length)];
    correct = c.name;

    speak("znajdź kolor " + correct);

    let choices = document.querySelectorAll(".choice");

    let selected = [c];

    while(selected.length < 3){
        let r = colors[Math.floor(Math.random()*colors.length)];
        if(!selected.includes(r)) selected.push(r);
    }

    selected.sort(()=>Math.random()-0.5);

    choices.forEach((el,i)=>{
        el.style.background = selected[i].color;
        el.dataset.name = selected[i].name;

        /* dla białego (gdybyś dodał) */
        if(selected[i].color === "white"){
            el.style.border = "2px solid black";
        } else {
            el.style.border = "none";
        }
    });
}

/* ✔️ sprawdzanie */
function check(el){

    if(el.dataset.name === correct){
        score++;
        speak("dobrze!");
    } else {
        speak("spróbuj jeszcze raz");
    }

    document.getElementById("score").innerText = "⭐ " + score;

    setTimeout(newRound, 1000);
}

/* start */
newRound();

</script>

</body>
</html>
