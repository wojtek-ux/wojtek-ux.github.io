<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Nauka Kolorów</title>

<style>
body {
    margin:0;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(135deg,#89f7fe,#66a6ff);
    color:white;
}

h1 {
    margin-top:20px;
}

#screen {
    font-size:40px;
    margin-top:40px;
}

#colorBox {
    width:220px;
    height:220px;
    margin:30px auto;
    border-radius:20px;
    display:none;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

button {
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🎨 Nauka Kolorów 🎨</h1>

<div id="screen">Kliknij START</div>

<div id="colorBox"></div>

<button onclick="start()">START</button>

<script>

/* 🎨 DUŻO KOLORÓW */
let colors = [
    {name:"czerwony", color:"red"},
    {name:"niebieski", color:"blue"},
    {name:"zielony", color:"green"},
    {name:"żółty", color:"yellow"},
    {name:"pomarańczowy", color:"orange"},
    {name:"różowy", color:"pink"},
    {name:"fioletowy", color:"purple"},
    {name:"brązowy", color:"brown"},
    {name:"czarny", color:"black"},
    {name:"biały", color:"white"},
    {name:"szary", color:"gray"},
    {name:"turkusowy", color:"turquoise"},
    {name:"złoty", color:"gold"},
    {name:"srebrny", color:"silver"}
];

/* 🗣️ mówienie */
function speak(text){
    let msg = new SpeechSynthesisUtterance(text);
    msg.lang = "pl-PL";
    speechSynthesis.cancel(); // 🔥 zatrzymuje stare
    speechSynthesis.speak(msg);
}

/* 🚀 start */
function start(){

    let screen = document.getElementById("screen");
    let box = document.getElementById("colorBox");

    box.style.display = "none";

    screen.innerText = "3...";
    speak("trzy");

    setTimeout(()=>{
        screen.innerText = "2...";
        speak("dwa");
    },1000);

    setTimeout(()=>{
        screen.innerText = "1...";
        speak("jeden");
    },2000);

    setTimeout(()=>{
        screen.innerText = "START!";
        speak("start");
    },3000);

    setTimeout(()=>{
        let c = colors[Math.floor(Math.random()*colors.length)];

        screen.innerText = "";
        box.style.display = "block";
        box.style.background = c.color;

        /* 🔥 specjalny tekst dla białego */
        if(c.name === "biały"){
            box.style.border = "3px solid black";
        } else {
            box.style.border = "none";
        }

        speak("to jest kolor " + c.name);

    },4000);
}

</script>

</body>
</html>
