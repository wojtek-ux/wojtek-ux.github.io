<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kolorowa Strona 🎨</title>

<style>
body {
    margin: 0;
    background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
    background-size: 400% 400%;
    animation: bg 6s infinite alternate;
    font-family: Arial;
    text-align: center;
}

@keyframes bg {
    0% {background-position: left;}
    100% {background-position: right;}
}

h1 {
    margin-top: 100px;
    font-size: 50px;
    color: white;
}

button {
    margin-top: 50px;
    padding: 20px 60px;
    font-size: 25px;
    border: none;
    border-radius: 20px;
    background: yellow;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.1);
    background: orange;
}
</style>
</head>

<body>

<h1>🎨 Witaj w świecie kolorów! 🎨</h1>

<button onclick="goColors()">Kolory</button>

<script>
function goColors() {
    window.location.href = "xq9v-7zplm.kra427fGd92lPqR-tYx_0nVzK/";
}
</script>

</body>
</html>
