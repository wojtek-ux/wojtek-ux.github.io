<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Uczekddzieci.pl</title>

<style>
body {
    margin: 0;
    background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc2eb, #a1c4fd);
    background-size: 400% 400%;
    animation: bg 6s infinite alternate;
    font-family: Arial;
    text-align: center;
}

@keyframes bg {
    0% {background-position: left;}
    100% {background-position: right;}
}

h1 {
    margin-top: 100px;
    font-size: 50px;
    color: white;
}

/* 🔘 kontener */
.buttons {
    margin-top: 50px;
}

/* 🔘 przyciski */
button {
    margin: 10px;
    padding: 20px 60px;
    font-size: 25px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
}

/* 🎨 Kolory */
.colorsBtn {
    background: yellow;
}

.colorsBtn:hover {
    transform: scale(1.1);
    background: orange;
}

/* 🔢 Liczby */
.numbersBtn {
    background: lightgreen;
}

.numbersBtn:hover {
    transform: scale(1.1);
    background: green;
    color: white;
}
</style>
</head>

<body>

<h1>🎨 Witaj w świecie nauki! 🎨</h1>

<div class="buttons">
    <button class="colorsBtn" onclick="goColors()">Kolory</button>
    <button class="numbersBtn" onclick="goNumbers()">Liczby</button>
</div>

<script>

/* 🎨 Kolory */
function goColors() {
    window.location.href = "xq9v-7zplm.kra427fGd92lPqR-tYx_0nVzK/";
}

/* 🔢 Liczby (TWÓJ LINK 🔥) */
function goNumbers() {
    window.location.href = "https://wojtek-ux.github.io/uczekddzieci.pl/7xQm9LpKz0VnYtR45hGdEwB2/";
}

</script>

</body>
</html>
